# OWNER: P2
# Per-operation hardware costs. Every number here is MODELED, never measured.
# Fill latency_ns / energy_pj and replace source with a citation (paper, table, page).
# Units: latency_ns per operation; energy_pj per operation (per byte for dram_*).
#
# Per-op units (see `unit` on each entry):
#   sram_* / bitserial_add: one row-wide step on a 256x256 SRAM subarray (all 256 bitlines in
#     parallel, one bit position). An n-bit bit-serial add is n+1 steps (Neural Cache).
#   cam_search: latency per search (all entries in parallel); energy per entry-bit compared,
#     so search energy = entries * key_bits * energy_pj (scales with the max_entries sweep).
#   dram_*: per byte streamed (bandwidth-limited); access latency is not included.
#
# status: VERIFY = proposed value; confirm the number against the cited table before the slides.
#         CHECKED = taken directly from the cited source.
# SRAM energies are derived from Horowitz's 45 nm SRAM read energy (8 KB array, 64-bit access
# ~10 pJ -> ~0.16 pJ/bit -> ~40 pJ per 256-bit row step), assuming an in-place compute step
# costs about one read, which is the Compute Caches / Neural Cache premise.

sram_xor:
  latency_ns: 1.0
  energy_pj: 40.0
  unit: "per 256-bit row step"
  source: >-
    Aga et al., "Compute Caches," HPCA 2017 (in-place bitwise ops on SRAM bitlines);
    energy derived from Horowitz, "Computing's Energy Problem," ISSCC 2014 (8 KB SRAM read)
  status: VERIFY
  note: "Check the Compute Caches latency/energy table for the bitwise-op cost relative to a read."

sram_min_search:
  latency_ns: 1.0
  energy_pj: 40.0
  unit: "per bit step of an MSB-first min search (n-bit min = n steps)"
  source: >-
    Eckert et al., "Neural Cache: Bit-Serial In-Cache Acceleration of Deep Neural Networks,"
    ISCA 2018 (bit-serial comparison, used for max-pooling); energy as for sram_xor
  status: VERIFY
  note: "Confirm Neural Cache's per-step cost for comparison/reduction ops."

bitserial_add:
  latency_ns: 1.0
  energy_pj: 40.0
  unit: "per bit step (n-bit add = n+1 steps)"
  source: >-
    Eckert et al., "Neural Cache," ISCA 2018 (bit-serial add takes n+1 cycles);
    energy as for sram_xor
  status: VERIFY
  note: "Confirm Neural Cache's array cycle time and per-cycle energy; 1 ns is a conservative pick."

convergence_or_reduce:
  latency_ns: 2.0
  energy_pj: 45.0
  unit: "per check of all syndrome bits in one subarray (row step + OR tree)"
  source: >-
    Aga et al., "Compute Caches," HPCA 2017 (wired-OR / search-style reduction on bitlines);
    estimate = one row step + small OR tree
  status: VERIFY
  note: "Estimate, not a table value. Replace with a direct number if you find one."

cam_search:
  latency_ns: 1.0
  energy_pj: 0.001
  unit: "latency per search; energy per entry-bit compared (1 fJ/bit/search)"
  source: >-
    Pagiamtzis and Sheikholeslami, "Content-Addressable Memory (CAM) Circuits and
    Architectures: A Tutorial and Survey," IEEE JSSC 41(3), 2006
  status: VERIFY
  note: "Check the survey's reported energy/bit/search and search time for the design you cite."

dram_read_byte:
  latency_ns: 0.039
  energy_pj: 244.0
  unit: "per byte streamed"
  source: >-
    Energy: Horowitz, ISSCC 2014 (DRAM 1.3-2.6 nJ per 64-bit access, midpoint / 8 bytes).
    Latency: 1 / 25.6 GB/s, one DDR4-3200 x64 channel (JEDEC JESD79-4)
  status: CHECKED
  note: "Horowitz is 45 nm-era DRAM; modern DDR4/HBM is lower energy. Say so on the slide."

dram_write_byte:
  latency_ns: 0.039
  energy_pj: 244.0
  unit: "per byte streamed"
  source: "Same as dram_read_byte (writes modeled at read cost)"
  status: CHECKED
  note: "Symmetric read/write is a simplification."

l2_byte:
  latency_ns: 0.0052
  energy_pj: 12.5
  capacity_bytes: 1048576
  unit: "per byte streamed to/from an on-chip L2 (read or write); used while BP fits in capacity_bytes"
  source: >-
    Energy: Horowitz, ISSCC 2014 (1 MB cache, 64-bit access ~100 pJ -> 12.5 pJ/byte).
    Latency: 1 / (64 B/cycle at 3 GHz), peak L2 bandwidth per core in the Intel 64 and IA-32
    Architectures Optimization Reference Manual (Skylake server cache table)
  status: VERIFY
  note: "Peak, not sustained, bandwidth (favours the CPU baseline). Capacity 1 MB = Horowitz's array size."

cpu_core_ns:
  latency_ns: 1.0
  energy_pj: 10000.0
  unit: "per ns of one busy core (energy_pj per ns = 10 W)"
  source: >-
    ASSUMED single-core active power of 10 W, the same assumption as osd_ns; used only to turn
    MEASURED bposd_cpu wall clock into energy
  status: VERIFY
  note: "Replace with the measuring CPU's package power / active cores if available."

cpu_op:
  latency_ns: 0.333
  energy_pj: 70.0
  unit: "per scalar instruction"
  source: >-
    Latency: 1 cycle at an assumed 3 GHz. Energy: Horowitz, ISSCC 2014 (~70 pJ per
    instruction including fetch/decode/register-file overhead; the 32-bit add itself is 0.1 pJ)
  status: VERIFY
  note: "Confirm the ~70 pJ instruction-overhead figure on the Horowitz slide."

# ---------------------------------------------------------------- published-number baselines
# status PUBLISHED = taken from the cited paper's own hardware/simulator, NOT modeled by us.
# Both are applied per BP iteration to OUR quantized min-sum iteration trace (same shots, same
# iteration counts, same CPU OSD fallback as every other system), so only the iteration time
# differs between systems. energy_pj .nan = not reported by the paper (NaN in service rows).

relay_fpga_iter:
  latency_ns: 24.0
  energy_pj: 1392600.0
  unit: "per BP iteration; energy = 24 ns x 58.025 W total FPGA power"
  source: >-
    Maurer et al., "Real-time decoding of the gross code memory with FPGAs," arXiv:2510.21600
    (2025): Relay-BP on an AMD VU19P, 2 cycles of a 12 ns decoder clock per flooding iteration
    = 24 ns; 58.025 W total power after place and route (Fig. 5)
  status: PUBLISHED
  note: >-
    Gross-code X decoder. Reused unchanged for the surface code (assumes a fully parallel design
    of that size fits). Relay-BP's own iteration counts (about 20 on average at p = 1e-3 per the
    paper) are not used; ours are.

nearmem_dpu_iter:
  latency_ns: 174600.0
  energy_pj: .nan
  unit: "per BP iteration (X + Z, serialized) = 0.873 ms / 5 iterations"
  source: >-
    Seo, Han, Hour, Kim, "High-Throughput Normalized Min-Sum Belief Propagation Decoding for
    Quantum LDPC Codes with Near-Memory Processing," arXiv:2608.27901 (2026): maximum sampled
    serialized X+Z DPU compute latency about 0.873 ms at five iterations (uPIMulator, UPMEM DPUs,
    11 tasklets per DPU)
  status: PUBLISHED
  note: >-
    Simulated, not measured on hardware. Data-qubit noise graph of [[144,12,12]] (much smaller
    than our circuit-level graphs), so applying it unscaled is optimistic for the DPU. A maximum,
    not a mean. Energy not reported.

osd_ns:
  latency_ns: 100000.0
  energy_pj: 1.0e+9
  unit: "per OSD call on the CPU (FALLBACK only; see source)"
  source: >-
    Per workload the service tables use a MEASURED-derived value instead: the median of paired
    per-shot ldpc timings, t(BpOsdDecoder) - t(BpDecoder) on the same non-converged TEST
    syndrome, with P1's bposd_cpu settings (scripts/p2_measure_osd.py -> data/costs/osd_<tag>.json).
    This constant is an ASSUMED fallback used only when no measurement exists for a tag.
    Energy = time * 10 W (cpu_core_ns)
  status: VERIFY
  note: >-
    Measured on Intel x86 (2026-11-03), one thread: about 3.3 ms at d5 and 32 ms at d7, so this
    fallback is far too low for those graphs. The median ignores OSD timing tails; report the
    osd_<tag>.json p99 alongside.
